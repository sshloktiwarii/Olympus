version: '3.8'

services:
  apex:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apex-runtime
    ports:
      - "8080:8080"
      - "9000:9000"
      - "5173:5173"
    environment:
      - HOST=0.0.0.0
      - UPSTREAM_LLM=http://host.docker.internal:11434
    volumes:
      - ./workspace:/apex/workspace
    # SECURITY INVARIANT (P0): Do NOT use 'privileged: true' (prevents host kernel escalation)
    privileged: false
    cap_add:
      - SYS_ADMIN     # Required for Bubblewrap unprivileged Linux namespaces
      - DAC_OVERRIDE  # Required for isolated file permission management
    security_opt:
      - apparmor:unconfined
    restart: unless-stopped
